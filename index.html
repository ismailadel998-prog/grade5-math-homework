<style>
  /* Layout: a stack of workbook pages (navy bands, green page edge) under a sticky homework bar.

  :root{

  /* ---------- sticky homework bar ---------- */

  .row1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}

  .prog{flex:1;min-width:180px}

  .prog .track{height:10px;background:#e1e4ec;border-radius:99px;overflow:hidden;margin-top:3px}

  .days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
  .day{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--white);border-radius:8px;padding:5px 11px;text-align:left;line-height:1.25;font-size:13px;color:var(--muted)}
  .day b{display:block;color:var(--ink);font-size:14px}

  /* ---------- workbook page ---------- */
  main{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:26px}
  .page{position:relative;background:var(--paper);box-shadow:0 2px 10px rgba(17,28,87,.12);border-top:16px solid var(--navy);border-bottom:16px solid var(--navy);padding:28px 70px 22px 40px;min-width:0}
  .page::after{content:"";position:absolute;top:0;bottom:0;right:0;width:30px;background:var(--green)}

  .page-foot .tl b{font-weight:700}

  .c1{grid-template-columns:1fr}
  .c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .split{gap:0}
  .split > .q{padding:18px 24px 22px 0;border-top:1.5px solid #9a9aa2}

  .q{position:relative;min-width:0}
  .qline{display:flex;gap:10px;align-items:baseline}
  .num{font-weight:700;min-width:28px;font-size:19px;color:#333;flex:0 0 auto}
  .tag{font-weight:700;color:#3d4450}

  .vert{display:inline-grid;grid-template-columns:auto auto;column-gap:8px;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.35}

  .opt.on b{background:var(--navy);border-color:var(--navy);color:var(--white)}

  .wrapx{overflow-x:auto;max-width:100%}
  .tape{font-size:14px;font-weight:700;margin:10px 0 0 38px;max-width:420px}
  .tape .tot{text-align:center;position:relative;padding-bottom:3px;border-bottom:1.5px solid var(--ink);margin-bottom:5px;font-style:italic}

  .q.ok .mark{display:flex;background:var(--ok)} .q.bad .mark{display:flex;background:var(--bad)}

  /* ---------- submit + result ---------- */
  .submitbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--white);border:2px solid var(--navy);border-radius:10px;padding:14px 18px}

  .rlist{display:grid;gap:4px;font-size:15px}

  .note{font-size:14px;color:var(--muted)}

  .modal{position:fixed;inset:0;background:rgba(10,16,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .box{background:var(--white);padding:22px;max-width:440px;width:100%;border-radius:10px;border-top:10px solid var(--navy)}

  .modal .mb{display:flex;gap:10px;margin-top:16px}.modal .mb button{flex:1}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--white);padding:10px 18px;font-weight:600;z-index:60;border-radius:8px;max-width:90vw;text-align:center}

  @media (max-width:860px){
    .page,.page.left{padding:22px 34px 20px 16px;border-top-width:11px;border-bottom-width:11px}

    .c3,.c4{grid-template-columns:1fr}

    .opts.two{grid-template-columns:1fr}
    .lines .l > span:first-child{min-width:0}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

       N(20,'<span class="tag">Higher Order Thinking</span> A family has a huge array of solar panels to make electricity. If each month they sell back 420 kWh for $0.07 per kWh, how much money could they make in a year?','352.8','dollars') ] },
     { assess:true, cols:2, qs:[
       MC(22,'Which of the following equations is <b>NOT</b> true?',['225 × 4 = 9,000','225 × 0.04 = 9','22.5 × 4 = 90','225 × 0.4 = 90'],'A',{ col:true }),
       MC(23,'Which of the following equations is <b>NOT</b> true?',['80 × 15 = 1,200','0.8 × 15 = 12','80 × 0.15 = 1.2','80 × 1.5 = 120'],'C',{ col:true }) ] } ] }
];

// what the student sees as the correct answer after submitting
function shownAnswer(q){
  const k = q.key;
  if (q.kind === 'mc') return k.c + ' · ' + q.opts['ABCD'.indexOf(k.c)];
  if (q.kind === 'multi') return k.m.map(i => 'ABCDE'[i]).join(', ');
  if (q.kind === 'digits') return '802 × 64 = 51,328';
  if (q.kind === 'choice') return k.c;
  const f = v => /^[0-9.]+$/.test(v) ? Number(v).toLocaleString('en-US', { maximumFractionDigits:6 }) : v;
  if (q.kind === 'lines') return q.lines.map(([l, p]) => f(k[p])).join(' · ');
  if (q.kind === 'table') return '0.1 gal → ' + f(k.a) + ' mi · 10 gal → ' + f(k.b) + ' mi';
  return f(k.a) + (q.unit ? ' ' + q.unit : '');
}

/* ===================== marking (final answers only) ===================== */
const toNum = s => { const t = String(s == null ? '' : s).replace(/[^0-9.\-]/g, ''); return t === '' || t === '.' ? NaN : Number(t); };
const same = (given, key) => /^[0-9.]+$/.test(key) ? Math.abs(toNum(given) - Number(key)) < 1e-9 : String(given || '').trim().toLowerCase() === key.toLowerCase();
function partsOf(q){ return q.kind === 'multi' ? ['m'] : Object.keys(q.key); }
function mark(q, a){
  a = a || {};
  const parts = {};
  if (q.kind === 'multi'){ const g = (a.m || []).slice().sort().join(','); parts.m = g === q.key.m.slice().sort().join(','); }
  else if (q.anyOrder){
    const got = Object.keys(q.key).map(p => toNum(a[p])).sort((x, y) => x - y), want = Object.values(q.key).map(Number).sort((x, y) => x - y);
    const ok = got.every((v, i) => Math.abs(v - want[i]) < 1e-9); Object.keys(q.key).forEach(p => parts[p] = ok);
  }
  else Object.keys(q.key).forEach(p => parts[p] = same(a[p], q.key[p]));
  return { right: Object.values(parts).every(Boolean), parts };
}
const filled = (q, a) => { a = a || {}; return q.kind === 'multi' ? (a.m || []).length > 0 : partsOf(q).every(p => String(a[p] || '').trim() !== ''); };

/* ===================== state ===================== */
const S = { name:'', cls:'', day:DAYS[0].id, ans:{}, checked:{}, results:{} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const dayOf = id => DAYS.find(d => d.id === id);
const qid = (d, q) => d.id + ':' + q.n;
const plain = h => { const t = document.createElement('div'); t.innerHTML = String(h).replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<br\s*\/?>/g, ' '); return t.textContent.replace(/\s+/g, ' ').trim(); };
function toast(m, ms){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms || 2600); }
function modal(h){ $('modalBox').innerHTML = h; $('modal').hidden = false; }
function closeModal(){ $('modal').hidden = true; }
const LS = () => 'g5hw44:' + (S.name ? (S.cls + '|' + S.name).toLowerCase() : 'guest');
function save(){ try { localStorage.setItem(LS(), JSON.stringify({ ans:S.ans, checked:S.checked, results:S.results })); } catch(e){} }
function load(){ try { return JSON.parse(localStorage.getItem(LS()) || 'null'); } catch(e){ return null; } }
function rememberDay(){ try { localStorage.setItem('g5hw44:day', S.day); } catch(e){} }

/* ===================== rendering ===================== */
function renderDays(){
  $('days').innerHTML = DAYS.map(d => `<button class="day ${d.id === S.day ? 'on' : ''}" data-day="${d.id}">
      <b>${d.day} ${d.date}${S.results[d.id] ? '<span class="dot" title="Submitted"></span>' : ''}</b>Page ${d.page}</button>`).join('');
}
function nb(id, p, cls){ return `<input class="b ${cls || ''}" id="${id.replace(':', '_')}_${p}" inputmode="decimal" autocomplete="off" data-q="${id}" data-p="${p}" aria-label="Answer">`; }

function qHtml(d, q){
  const id = qid(d, q);
  const head = q.text ? `<div class="qline"><span class="num">${q.n}.</span><div class="txt">${q.tag && !q.text.includes(q.tag) ? `<span class="tag">${q.tag}</span> ` : ''}${q.text}</div></div>` : '';
  let body = '';
  switch (q.kind){
    case 'vert':
      body = `<div class="qline"><span class="num">${q.n}.</span><div class="vert"><span></span><span class="r">${q.a}</span><span>×</span><span class="r u">${q.b}</span></div></div>
        <div class="ans">${nb(id, 'a')}</div>`; break;
    case 'num':
      body = (q.side ? `<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start"><div style="flex:1 1 300px;min-width:0">${head}</div><div class="wrapx">${q.side}</div></div>` : head)
        + (q.pvc ? pvChart() : '') + (q.after || '')
        + `<div class="ans">${q.pvc ? '<span class="lab">36 × 405 =</span>' : ''}${nb(id, 'a')}${q.unit ? `<span>${q.unit}</span>` : ''}</div>`; break;
    case 'lines':
      body = (head || `<div class="qline"><span class="num">${q.n}.</span><div></div></div>`)
        + `<div class="lines">${q.lines.map(([l, p]) => `<div class="l"><span>${l}</span>${nb(id, p)}</div>`).join('')}</div>`; break;
    case 'exp':
      body = `<div class="qline"><span class="num">${q.n}.</span><span class="inl">${q.before}<sup>${nb(id, 'a', 'sm').replace('class="b sm"', 'class="b sm" style="height:34px;width:52px;font-size:17px;vertical-align:4px"')}</sup>${q.after}</span></div>`; break;
    case 'choice':
      body = head + `<div class="opts">${q.opts.map(o => `<button class="opt" data-q="${id}" data-p="c" data-v="${esc(o)}"><b></b><span>${esc(o)}</span></button>`).join('')}</div>`; break;
    case 'mc':
      body = head + `<div class="opts ${q.col ? 'col' : 'two'}">${(q.col ? [0,1,2,3] : [0,2,1,3]).map(i => `<button class="opt" data-q="${id}" data-p="c" data-v="${'ABCD'[i]}"><b>${'ABCD'[i]}</b><span>${q.opts[i]}</span></button>`).join('')}</div>`; break;
    case 'multi':
      body = head + `<div class="opts col">${q.opts.map((o, i) => `<button class="opt sq" data-q="${id}" data-p="m" data-v="${i}"><b>${'ABCDE'[i]}</b><span>${o}</span></button>`).join('')}</div>`; break;
    case 'digits':
      body = head + `<div class="digits"><span>Greatest product:</span>
          <label><i>a</i>${nb(id, 'a', 'sm')}</label><span>0</span><label><i>b</i>${nb(id, 'b', 'sm')}</label>
          <span style="margin:0 6px">×</span><label><i>c</i>${nb(id, 'c', 'sm')}</label><label><i>d</i>${nb(id, 'd', 'sm')}</label></div>`; break;
    case 'table':
      body = head + `<div class="wrapx" style="margin:10px 0 0 38px"><div class="data"><table><tr><th>Gallons</th><th>Miles</th></tr>${q.rows.map(([g, m]) =>
          `<tr><td>${g}</td><td>${/^[ab]$/.test(m) ? nb(id, m).replace('class="b ', 'class="b sm" style="width:110px" data-x="') : m}</td></tr>`).join('')}</table></div></div>
          <p class="note" style="margin:6px 0 0 38px">What pattern do you see in the table?</p>`; break;
  }
  return `<div class="q" id="q_${id.replace(':', '_')}"><span class="mark"></span>${body}
    <div class="chk"><button data-check="${id}">Check</button><span class="fb" id="fb_${id.replace(':', '_')}"></span></div></div>`;
}
function pvChart(){
  const heads = ['hundred thousands','ten thousands','one thousands','hundreds','tens','ones'];
  const row = (cells, x) => `<tr>${cells.map((c, i) => `<td class="${i === 0 && x ? 'g' : ''}">${c}</td>`).join('')}</tr>`;
  return `<div class="wrapx"><table class="pvc"><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr>
    ${row(['','','','4','0','5'])}${row(['×','','','','3','6'], true)}${row(['','','','','',''])}${row(['','','','','',''])}${row(['','','','','',''])}</table></div>`;
}

function render(){
  const d = dayOf(S.day);
  renderDays();
  const left = d.page % 2 === 0;
  let h = `<section class="page ${left ? 'left' : ''}">
    <span class="hwtag">${d.day} ${d.date} · ${d.plan}</span>
    <div class="namebar"><label for="nameIn">Name</label>
      <div class="nm"><input id="nameIn" placeholder="Start typing your first name..." autocomplete="off" spellcheck="false">
        <div class="ac" id="ac" hidden></div><div class="help" id="nameHelp">Type the first letters of your first name, then tap it in the list.</div></div>
      <label for="clsSel">Class</label><select class="clsel" id="clsSel"><option value="">—</option>${CLASSES.map(c => `<option>${c}</option>`).join('')}</select></div>`;
  if (d.first) h += `<div class="page-top"><div class="ap-box"><div class="ap-title">Additional<br>Practice <em>${d.lesson}</em></div><div class="ap-sub">${TITLES[d.lesson]}</div></div></div>
      <div class="another"><h3>Another Look!</h3>${LOOK[d.lesson]}</div>`;
  d.blocks.forEach(b => {
    if (b.dir) h += `<div><div class="dir">${b.dir}</div></div>`;
    if (b.assess) h += `<div class="assess"><span class="pill"><i>✓</i>Assessment Practice</span><hr></div>`;
    if (b.data) h += `<div class="wrapx" style="display:flex;justify-content:flex-end;margin-bottom:6px">${b.data}</div>`;
    h += `<div class="qs ${b.split ? 'split c2' : 'c' + b.cols}">${b.qs.map(q => qHtml(d, q)).join('')}</div>`;
  });
  h += `<div class="page-foot">${left ? `<span>${d.page}</span><span class="tl"><b>Topic ${TOPIC[d.lesson]}</b><em>Lesson ${d.lesson}</em></span>`
                                     : `<span class="tl"><b>Topic ${TOPIC[d.lesson]}</b><em>Lesson ${d.lesson}</em></span><span>${d.page}</span>`}</div></section>`;
  h += `<div id="resultArea"></div><div class="submitbox" id="submitBox"><p>Finished? Submit this day’s homework to see your score and download your PDF.</p>
        <button class="tb fill" id="submitBtn">Submit ${d.day}’s homework</button></div>`;
  $('main').innerHTML = h;
  d.blocks.forEach(b => b.qs.forEach(q => { fill(d, q); paint(d, q); }));
  initName(); counts();
  if (S.results[d.id]) showResult(d, false);
  $('submitBtn').onclick = () => askSubmit(d);
}

function fill(d, q){
  const id = qid(d, q), a = S.ans[id] || {};
  document.querySelectorAll(`[data-q="${id}"]`).forEach(el => {
    if (el.classList.contains('opt')) el.classList.toggle('on', el.dataset.p === 'm' ? (a.m || []).includes(+el.dataset.v) : a[el.dataset.p] === el.dataset.v);
    else el.value = a[el.dataset.p] || '';
  });
}
function paint(d, q){
  const id = qid(d, q), c = S.checked[id], box = $('q_' + id.replace(':', '_')); if (!box) return;
  box.classList.toggle('ok', !!(c && c.right)); box.classList.toggle('bad', !!(c && !c.right));
  box.querySelectorAll('[data-q]').forEach(el => {
    el.classList.remove('ok', 'bad');
    if (!c) return;
    const st = c.parts[el.dataset.p] ? 'ok' : 'bad';
    if (el.classList.contains('b') || el.classList.contains('on')) el.classList.add(el.dataset.p === 'm' ? (c.right ? 'ok' : 'bad') : st);
  });
  const fb = $('fb_' + id.replace(':', '_'));
  fb.className = 'fb' + (c ? (c.right ? ' ok' : ' bad') : '');
  fb.textContent = c ? (c.right ? ['Correct!', 'Great job!', 'You got it!', 'Excellent!'][q.n % 4] : 'Not yet, try again.') : '';
}
function counts(){
  const d = dayOf(S.day), qs = d.blocks.flatMap(b => b.qs);
  const done = qs.filter(q => filled(q, S.ans[qid(d, q)])).length;
  $('nDone').textContent = done; $('nAll').textContent = qs.length; $('dayName').textContent = 'Page ' + d.page;
  $('fill').style.width = Math.round(done / qs.length * 100) + '%';
}

/* ===================== name search (first name) ===================== */
function initName(){
  const inp = $('nameIn'), ac = $('ac');
  let items = [], hi = -1;
  if (S.name){ inp.value = S.name; $('clsSel').value = S.cls; nameOk(); }
  const reset = () => { S.name = ''; S.cls = ''; $('nameHelp').className = 'help'; $('nameHelp').textContent = 'Type the first letters of your first name, then tap it in the list.'; };
  let reqId = 0, timer;
  const show = () => {
    const t = inp.value.trim(), cls = $('clsSel').value;
    clearTimeout(timer);
    if (!t){ ac.hidden = true; return; }
    ac.innerHTML = '<div class="none">Searching…</div>'; ac.hidden = false;
    const my = ++reqId;
    timer = setTimeout(async () => {
      let list;
      try { const r = await fetch(API + '?q=' + encodeURIComponent(t) + '&cls=' + encodeURIComponent(cls)); list = await r.json(); }
      catch(e){ if (my === reqId) ac.innerHTML = '<div class="none">Could not load the class list. Check the internet.</div>'; return; }
      if (my !== reqId) return;
      items = list.slice(0, 10); hi = -1;
      ac.innerHTML = items.length ? items.map((s, i) => `<div data-i="${i}"><span><mark>${esc(s.name.slice(0, t.length))}</mark>${esc(s.name.slice(t.length))}</span><span class="badge">${s.cls}</span></div>`).join('')
                                  : '<div class="none">No name found. Check the spelling or choose your class.</div>';
    }, 200);
  };
  inp.oninput = () => { if (S.name) reset(); show(); };
  inp.onfocus = () => { if (!S.name) show(); };
  inp.onblur = () => setTimeout(() => ac.hidden = true, 150);
  inp.onkeydown = e => {
    const rows = ac.querySelectorAll('[data-i]');
    if (e.key === 'ArrowDown'){ hi = Math.min(hi + 1, rows.length - 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ hi = Math.max(hi - 1, 0); e.preventDefault(); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (items[Math.max(hi, 0)]) pick(items[Math.max(hi, 0)]); return; }
    else return;
    rows.forEach((r, i) => r.classList.toggle('hi', i === hi));
  };
  ac.onmousedown = e => { const r = e.target.closest('[data-i]'); if (r){ e.preventDefault(); pick(items[+r.dataset.i]); } };
  $('clsSel').onchange = () => { if (S.name && $('clsSel').value !== S.cls){ reset(); inp.value = ''; } inp.focus(); show(); };
}
function nameOk(){ $('nameHelp').className = 'help ok'; $('nameHelp').textContent = '✓ ' + S.cls; }
function pick(s){
  const guest = { ans:S.ans, checked:S.checked, results:S.results };
  S.name = s.name; S.cls = s.cls;
  const mine = load();
  if (mine){ S.ans = mine.ans || {}; S.checked = mine.checked || {}; S.results = mine.results || {}; toast('Welcome back, ' + s.name.split(' ')[0] + '!'); }
  else { S.ans = guest.ans; S.checked = guest.checked; S.results = guest.results; toast('Hello, ' + s.name.split(' ')[0] + '!'); }
  try { localStorage.removeItem('g5hw44:guest'); } catch(e){}
  save(); render(); resendOld();
}
function needName(){
  if (S.name) return false;
  window.scrollTo({ top:0, behavior:'smooth' }); setTimeout(() => $('nameIn').focus(), 300);
  toast('First type your first name at the top and choose it from the list.'); return true;
}

/* ===================== answering ===================== */
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.q) return;
  el.value = el.value.replace(/[^0-9.,]/g, '');
  setAns(el.dataset.q, el.dataset.p, el.value);
});
document.addEventListener('click', e => {
  const dy = e.target.closest('[data-day]'); if (dy){ S.day = dy.dataset.day; rememberDay(); render(); window.scrollTo({ top:0 }); return; }
  const o = e.target.closest('.opt');
  if (o){
    const id = o.dataset.q;
    if (o.dataset.p === 'm'){
      const a = S.ans[id] || {}, m = new Set(a.m || []), v = +o.dataset.v;
      m.has(v) ? m.delete(v) : m.add(v); o.classList.toggle('on', m.has(v));
      setAns(id, 'm', [...m].sort());
    } else {
      document.querySelectorAll(`.opt[data-q="${id}"]`).forEach(x => x.classList.toggle('on', x === o));
      setAns(id, 'c', o.dataset.v);
    }
    return;
  }
  const ck = e.target.closest('[data-check]'); if (ck) check(ck.dataset.check);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.q){ e.preventDefault(); check(e.target.dataset.q); } });

function findQ(id){ const [dId, n] = id.split(':'); const d = dayOf(dId); return [d, d.blocks.flatMap(b => b.qs).find(q => String(q.n) === n)]; }
function setAns(id, p, v){
  S.ans[id] = S.ans[id] || {}; S.ans[id][p] = v;
  if (S.checked[id]){ delete S.checked[id]; const [d, q] = findQ(id); paint(d, q); }
  save(); counts();
}
function check(id){
  if (needName()) return;
  const [d, q] = findQ(id), a = S.ans[id] || {}, fb = $('fb_' + id.replace(':', '_'));
  if (!filled(q, a)){ fb.className = 'fb bad'; fb.textContent = q.kind === 'multi' ? 'Choose at least one answer first.' : 'Fill in every box first.'; return; }
  S.checked[id] = mark(q, a); save(); paint(d, q);
}

/* ===================== submit + result ===================== */
function askSubmit(d){
  if (needName()) return;
  const qs = d.blocks.flatMap(b => b.qs), blank = qs.filter(q => !filled(q, S.ans[qid(d, q)])).length;
  modal(`<h3>Submit ${d.day}’s homework?</h3><p><b>${esc(S.name)}</b> · ${S.cls} · Page ${d.page}</p>
    <p>${blank ? `You still have <b style="color:var(--bad)">${blank}</b> question${blank > 1 ? 's' : ''} not answered.` : 'You answered every question.'}</p>
    <div class="mb"><button class="tb" id="mNo">Go back</button><button class="tb fill" id="mYes">Submit</button></div>`);
  $('mNo').onclick = closeModal;
  $('mYes').onclick = () => {
    closeModal();
    const res = { at:new Date().toISOString(), items:{} }; let score = 0;
    qs.forEach(q => { const id = qid(d, q), m = mark(q, S.ans[id]); res.items[q.n] = m.right; if (m.right) score++; S.checked[id] = m; paint(d, q); });
    res.score = score; res.total = qs.length;
    S.results[d.id] = res; save(); renderDays(); showResult(d, true); sendResult(d, res);
  };
}
function showResult(d, scroll){
  const r = S.results[d.id], qs = d.blocks.flatMap(b => b.qs), pct = Math.round(r.score / r.total * 100);
  const msg = pct >= 90 ? 'Amazing work!' : pct >= 75 ? 'Great job!' : pct >= 50 ? 'Good effort! Keep practicing.' : 'Keep going, you can do it!';
  $('resultArea').innerHTML = `<div class="result">
      <div class="who">${esc(S.name)} · ${S.cls} · ${d.day} ${d.date} · Page ${d.page}</div>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="score">${r.score} / ${r.total}</span><b>${pct}% · ${msg}</b></div>
      <div class="btns"><button class="tb fill" id="pdfBtn">⬇ Download PDF</button></div>
      <p class="note" id="sendNote">${r.sent ? '✓ Your result was sent to your teacher.' : ''}</p>
      <p class="note" id="pdfNote">Your teacher receives your result automatically. The PDF is a backup copy.</p>
      <div class="rlist">${qs.map(q => r.items[q.n] ? `<div><b style="color:var(--ok)">✓ ${q.n}.</b><span>Correct</span></div>`
          : `<div><b style="color:var(--bad)">✗ ${q.n}.</b><span>Correct answer: <b>${esc(shownAnswer(q))}</b></span></div>`).join('')}</div></div>`;
  $('submitBtn').textContent = 'Submit again';
  $('pdfBtn').onclick = () => downloadPDF(d);
  if (scroll) $('resultArea').scrollIntoView({ behavior:'smooth', block:'start' });
}

/* ===================== send result to the teacher's Google Sheet ===================== */
const QKEY = 'g5hw44:queue';
const setNote = t => { const n = $('sendNote'); if (n) n.innerHTML = t; };
const queue = () => { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(e){ return []; } };
const setQueue = q => { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){} };
const postOne = p => fetch(API, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(p) });
async function sendResult(d, res){
  const qs = d.blocks.flatMap(b => b.qs);
  const p = { cls:S.cls, name:S.name, day:d.day, date:d.date, page:d.page, score:res.score, total:res.total,
    items:qs.map(q => ({ n:q.n, ok:!!res.items[q.n], given:givenText(q, S.ans[qid(d, q)]), correct:shownAnswer(q) })) };
  setNote('Sending to your teacher…');
  try { await postOne(p); res.sent = true; save(); setNote('✓ Your result was sent to your teacher.'); }
  catch(e){ setQueue(queue().concat([p])); setNote('<b style="color:var(--bad)">Could not send (no internet).</b> It will be sent automatically next time you open this page. You can also download the PDF.'); }
}
async function flushQueue(){ const q = queue(); if (!q.length) return; const left = [];
  for (const p of q){ try { await postOne(p); } catch(e){ left.push(p); } } setQueue(left); }

/* Re-send results made before the sheet was cleared (11 Nov 2026, 15:50 UTC), once per student */
const WIPE = '2026-11-11T15:50:00.000Z';
async function resendOld(){
  for (const d of DAYS){ const r = S.results[d.id];
    if (r && !r.resent && r.at && r.at < WIPE){ await sendResult(d, r); r.resent = true; save(); } }
}

/* ===================== PDF for the teacher ===================== */
const pdfText = s => String(s == null ? '' : s).replace(/[−–]/g, '-').replace(/[’‘]/g, "'").replace(/▢/g, '[ ]').replace(/→/g, '->')
  .replace(/[^\x20-\x7E\xA0-\xFF×·]/g, '');
function givenText(q, a){
  a = a || {};
  if (q.kind === 'multi') return (a.m || []).map(i => 'ABCDE'[i]).join(', ');
  if (q.kind === 'digits') return a.a || a.b || a.c || a.d ? `${a.a || '_'}0${a.b || '_'} × ${a.c || '_'}${a.d || '_'}` : '';
  return partsOf(q).map(p => a[p] || '').filter(x => String(x).trim()).join(' / ');
}
async function downloadPDF(d){
  if (!window.jspdf){ toast('The PDF maker did not load. Check the internet and reload the page.', 4000); return; }
  const r = S.results[d.id], qs = d.blocks.flatMap(b => b.qs);
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit:'mm', format:'a4' });
  const W = 210, H = 297, L = 16, R = W - 22, NAVY = [17, 28, 87], GREEN = [92, 194, 70];
  const frame = () => { doc.setFillColor(...NAVY); doc.rect(0, 0, W, 7, 'F'); doc.rect(0, H - 7, W, 7, 'F'); doc.setFillColor(...GREEN); doc.rect(W - 9, 7, 9, H - 14, 'F'); };
  frame();
  doc.setTextColor(...NAVY); doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
  doc.text('Grade 5 Math Homework', L, 20);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(60, 60, 60);
  doc.text(pdfText(`${d.day} ${d.date} · Page ${d.page} · Lesson ${d.lesson} ${TITLES[d.lesson]}`), L, 27);
  doc.setDrawColor(200, 200, 205); doc.setLineWidth(.6); doc.roundedRect(L, 33, R - L, 30, 3, 3, 'S');
  doc.setFontSize(11); doc.text('Name', L + 5, 41); doc.text('Class', L + 5, 49); doc.text('Submitted', L + 5, 57);
  doc.setTextColor(20, 20, 20); doc.setFont('helvetica', 'bold'); doc.text(pdfText(S.name), L + 30, 41); doc.text(S.cls, L + 30, 49);
  doc.setFont('helvetica', 'normal'); doc.text(new Date(r.at).toLocaleString('en-GB'), L + 30, 57);
  doc.setFillColor(...NAVY); doc.roundedRect(R - 52, 37, 48, 22, 3, 3, 'F'); doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.text(r.score + ' / ' + r.total, R - 28, 48, { align:'center' });
  doc.setFontSize(11); doc.text(Math.round(r.score / r.total * 100) + '%', R - 28, 55, { align:'center' });
  let y = 72;
  const head = () => { doc.setFillColor(...NAVY); doc.rect(L, y, R - L, 7, 'F'); doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    doc.text('Q', L + 2, y + 4.8); doc.text('Question', L + 10, y + 4.8); doc.text('Result', L + 84, y + 4.8); doc.text('Student answer', L + 102, y + 4.8); doc.text('Correct answer', L + 140, y + 4.8); y += 7; };
  head();
  qs.forEach(q => {
    const ok = r.items[q.n], a = S.ans[qid(d, q)];
    const qt = pdfText(q.kind === 'vert' ? `${q.a} × ${q.b}` : q.kind === 'exp' ? q.before + '^[ ]' + q.after : plain(q.text || (q.lines || []).map(l => l[0]).join(' ')));
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const c1 = doc.splitTextToSize(qt, 72), c2 = doc.splitTextToSize(pdfText(givenText(q, a)) || '(blank)', 36), c3 = doc.splitTextToSize(ok ? '' : pdfText(shownAnswer(q)), R - L - 142);
    const h = Math.max(c1.length, c2.length, c3.length, 1) * 4 + 2.6;
    if (y + h > H - 16){ doc.addPage(); frame(); y = 16; head(); }
    doc.setFillColor(...(ok ? [225, 243, 232] : [251, 228, 228])); doc.rect(L, y, R - L, h, 'F');
    doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'bold'); doc.text(String(q.n), L + 2, y + 4.4);
    doc.setFont('helvetica', 'normal'); doc.text(c1, L + 10, y + 4.4);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(...(ok ? [29, 127, 70] : [194, 59, 59])); doc.text(ok ? 'Right' : (filled(q, a) ? 'Wrong' : 'Blank'), L + 84, y + 4.4);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 30, 30); doc.text(c2, L + 102, y + 4.4); if (c3.length) doc.text(c3, L + 140, y + 4.4);
    y += h;
  });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++){ doc.setPage(i); doc.setFontSize(8.5); doc.setTextColor(90, 90, 90); doc.setFont('helvetica', 'normal');
    doc.text(pdfText(`${S.name} · ${S.cls} · ${d.day} ${d.date} · page ${d.page}`), L, H - 11); doc.text(`Page ${i} of ${n}`, R, H - 11, { align:'right' }); }
  const file = (`Grade5_${S.cls}_${S.name}_${d.day}_p${d.page}`).replace(/[^A-Za-z0-9_]+/g, '_') + '.pdf';
  const blob = doc.output('blob');
  const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (downloads){
    try { await downloads.save({ filename:file, data:blob }); toast('PDF saved. Send it to your teacher.', 4000); }
    catch (e){ if (e && e.code === 'declined') toast('The PDF was not saved. Press Download PDF again when you are ready.', 4000);
               else if (e && e.code === 'rate_limited') toast('Please wait a moment, then press Download PDF again.', 4000);
               else { $('pdfNote').innerHTML = 'Downloading is not available here. <b>Take a screenshot of this score</b> and send it to your teacher.'; } }
  } else {
    try { doc.save(file); toast('PDF saved. Send it to your teacher.', 4000); }
    catch (e){ $('pdfNote').innerHTML = 'Downloading is not available here. <b>Take a screenshot of this score</b> and send it to your teacher.'; }
  }
}

/* ===================== start ===================== */
(function start(){
  try { const d = localStorage.getItem('g5hw44:day'); if (d && dayOf(d)) S.day = d; } catch(e){}
  const g = load(); if (g){ S.ans = g.ans || {}; S.checked = g.checked || {}; S.results = g.results || {}; }
  render(); flushQueue();
})();
</script>
